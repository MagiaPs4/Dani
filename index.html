<html>
<head>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  /* Fondo = tu foto de la PS4 con graffiti */
  .fondo-ps4 {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url('fondo.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  #menu {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  /* BOTON - donde marcaste con blanco, frontal izquierdo de la PS4 */
  .btn-ps4-original {
    pointer-events: auto;
    position: absolute;
    /* Ajustado a tu marca blanca */
    left: 12.5%;
    top: 41.5%;
    width: 18%;
    max-width: 340px;
    height: 52px;
    /* Sigue la perspectiva de la consola */
    transform: perspective(600px) rotateY(18deg) rotateX(-4deg) rotate(-1deg);
    transform-origin: left center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #ffffff;
    /* Como el boton original de PS4: negro brillante, mate, casi integrado */
    background: linear-gradient(180deg, #2b2b2b 0%, #111111 45%, #000000 100%);
    border: 1px solid #3a3a3a;
    border-top: 1px solid #555;
    border-radius: 6px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -2px 4px rgba(0,0,0,0.9),
      0 3px 8px rgba(0,0,0,0.6);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }
  .btn-ps4-original:active {
    background: #000;
    box-shadow: inset 0 2px 8px rgba(0,0,0,1);
    transform: perspective(600px) rotateY(18deg) rotateX(-4deg) rotate(-1deg) translateY(1px);
  }
  /* En movil, que no se salga */
  @media (max-width: 700px) {
    .btn-ps4-original {
      left: 10%;
      top: 42%;
      width: 32%;
      height: 38px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>
<script>
var histlength=history.length;history.go(-histlength 2);
</script>
<h1 id=msgs style="display:none;">PS4 Exploit Host By FonSy</h1>

<div class="fondo-ps4"></div>

<div id=menu>
  <button class="btn btn-multi btn-ps4-original" onclick="location.replace('g2all/index.html')">DALE PARA JUGAR</button>
</div>

</body>
</html>
